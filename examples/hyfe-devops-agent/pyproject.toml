[project]
name = "hyfe-devops-agent-dev"
version = "0.1.0"
description = "Hyfe DevOps Agent for langgraph dev"
requires-python = ">=3.11"
dependencies = [
    "langchain-openai>=0.3",
    "deepagents>=0.3.5,<0.4.0",
    "langfuse>=3.0,<5.0",
    "githubkit>=0.15",
    "httpx>=0.27",
]


[tool.uv.sources]
deepagents = { path = "../../libs/deepagents", editable = true }

[dependency-groups]
test = [
    "deepeval>=4.0,<5.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests requiring API keys or external services",
    "eval: marks DeepEval integration evaluation tests",
]
